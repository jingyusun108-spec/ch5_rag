<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>农业病虫害 RAG 问答系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .container {
            width: 680px; max-width: 92vw; background: #fff;
            border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
            padding: 32px;
        }
        h1 { font-size: 22px; color: #2e7d32; margin-bottom: 6px; }
        .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
        .chat-box {
            height: 320px; overflow-y: auto; border: 1px solid #eee;
            border-radius: 10px; padding: 16px; background: #fafafa; margin-bottom: 16px;
        }
        .msg { margin-bottom: 14px; }
        .msg .role { font-size: 12px; color: #999; margin-bottom: 3px; }
        .msg .bubble {
            display: inline-block; max-width: 85%; padding: 10px 14px;
            border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap;
        }
        .user .bubble { background: #2e7d32; color: #fff; }
        .ai .bubble { background: #e8f5e9; color: #333; }
        .input-row { display: flex; gap: 10px; }
        #question {
            flex: 1; padding: 12px 14px; border: 1px solid #ddd;
            border-radius: 10px; font-size: 14px; outline: none;
        }
        #question:focus { border-color: #2e7d32; }
        #send {
            padding: 0 22px; border: none; border-radius: 10px;
            background: #2e7d32; color: #fff; font-size: 14px; cursor: pointer;
        }
        #send:disabled { background: #a5d6a7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>农业病虫害 RAG 问答系统</h1>
        <p class="sub">基于 LangChain Agent + Redis 向量库 · 检索增强生成</p>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-row">
            <input id="question" placeholder="输入农业问题，例如：水稻稻瘟病怎么防治？" />
            <button id="send" onclick="send()">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const input = document.getElementById("question");
        const btn = document.getElementById("send");

        function addMsg(role, text) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            div.innerHTML = '<div class="role">' + (role === "user" ? "我" : "AI 助手") +
                '</div><div class="bubble">' + escapeHtml(text) + "</div>";
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/\n/g, "<br>");
        }

        async function send() {
            const q = input.value.trim();
            if (!q) return;
            addMsg("user", q);
            input.value = "";
            btn.disabled = true;
            try {
                const res = await fetch("/rag/ask?question=" + encodeURIComponent(q));
                const data = await res.json();
                addMsg("ai", data.code === 0 ? data.answer : "出错：" + data.error);
            } catch (e) {
                addMsg("ai", "请求失败：" + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    </script>
</body>
</html>
